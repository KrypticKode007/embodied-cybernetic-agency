# config/conditions.yaml
# Defines architectural toggles for each experimental condition.

conditions:
  A_reactive_baseline:
    id: "A"
    description: "Reactive baseline: no world model, no telemetry, no self-model."
    world_model_enabled: false
    telemetry_enabled: false
    self_model_enabled: false
    regulation_mode: "risk_agnostic"   # ignores structural risk, no mode switching

  B_predictive_agent:
    id: "B"
    description: "Predictive agent: world model only, no telemetry or self-model."
    world_model_enabled: true
    telemetry_enabled: false
    self_model_enabled: false
    regulation_mode: "risk_light"      # can react to prediction error only

  C_embodied_predictive_agent:
    id: "C"
    description: "Embodied predictive agent: world model + telemetry, limited self-awareness."
    world_model_enabled: true
    telemetry_enabled: true
    self_model_enabled: false          # or 'limited' if you want an intermediate type
    regulation_mode: "resource_aware"  # responds to resource integrity + error

  D_full_cybernetic_agent:
    id: "D"
    description: "Full cybernetic agent: world model + telemetry + metacognitive self-model."
    world_model_enabled: true
    telemetry_enabled: true
    self_model_enabled: true
    regulation_mode: "risk_sensitive"  # full structural risk index and mode switching